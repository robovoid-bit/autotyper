['maze','Maze Runner 3D','A first-person ray casting maze. New random maze every run, minimap, timer, run button and game controller support.',[['Game','ghost',"# ==============================================================\n#  MAZE RUNNER 3D  -  a ray casting game written in Python\n# ==============================================================\n#  Arrow keys or WASD ..... walk forward / back and turn\n#  Q and E ................ sidestep left / right\n#  Hold Shift ............. run\n#  M ...................... show or hide the map\n#  Game controller ........ left stick walks and turns\n#\n#  Find the glowing green door to win. Every run makes a new maze.\n#  Click the green flag to start.\n#\n#  How it works: for every vertical slice of the screen we shoot a\n#  ray out from the player and step it through the grid (the DDA\n#  algorithm) until it hits a wall. The farther the wall, the\n#  shorter the slice we draw. That is all a \"3D\" maze really is.\n# ==============================================================\nhide()\nrefresh_off()                # build everything without redrawing the screen\n\n# ---------- settings you can change ----------\nSIZE = 21                    # maze size in cells (use an odd number)\nCOLS = 96                    # slices per frame: more = sharper but slower\nFOV = 1.1                    # field of view in radians (about 63 degrees)\nSLICE = 480 / COLS           # width of one slice in pixels\n\n# ---------- 1. make a random maze (depth first search) ----------\ngrid = []\nfor y in range(SIZE):\n    row = []\n    for x in range(SIZE):\n        row.append(1)\n    grid.append(row)\n\ngrid[1][1] = 0\nstack = [[1, 1]]\nwhile len(stack) > 0:\n    cell = stack[-1]\n    mx = cell[0]\n    my = cell[1]\n    options = []\n    if mx > 2 and grid[my][mx - 2] == 1:\n        options.append([-2, 0])\n    if mx < SIZE - 3 and grid[my][mx + 2] == 1:\n        options.append([2, 0])\n    if my > 2 and grid[my - 2][mx] == 1:\n        options.append([0, -2])\n    if my < SIZE - 3 and grid[my + 2][mx] == 1:\n        options.append([0, 2])\n    if len(options) == 0:\n        stack.pop()\n    else:\n        d = random.choice(options)\n        grid[my + d[1] // 2][mx + d[0] // 2] = 0\n        grid[my + d[1]][mx + d[0]] = 0\n        stack.append([mx + d[0], my + d[1]])\n\n# colour the walls in zones: 1 = brick red, 2 = blue, 3 = mossy green\nfor y in range(SIZE):\n    for x in range(SIZE):\n        if grid[y][x] == 1:\n            grid[y][x] = (x // 5 + y // 5) % 3 + 1\n\n# the exit door: a glowing green block in the outer wall (type 9)\nDOOR_X = SIZE - 1\nDOOR_Y = SIZE - 2\ngrid[DOOR_Y][DOOR_X] = 9\n\nWALLS = [[0, 0, 0], [196, 84, 66], [70, 112, 204], [76, 168, 96], [70, 255, 140]]\n\n# ---------- 2. the player ----------\npx = 1.5                     # position in the grid\npy = 1.5\nangle = 0.0                  # 0 = looking east; turning right adds to it\nshow_map = True\n\n# ---------- 3. helper functions ----------\ndef free(x, y):\n    r = 0.22                 # the player is a little square, not a point\n    return grid[int(y - r)][int(x - r)] == 0 and grid[int(y - r)][int(x + r)] == 0 and grid[int(y + r)][int(x - r)] == 0 and grid[int(y + r)][int(x + r)] == 0\n\ndef walk(dx, dy):\n    global px, py\n    if free(px + dx, py):    # moving one axis at a time lets you slide along walls\n        px += dx\n    if free(px, py + dy):\n        py += dy\n\ndef cast(ray):\n    # Shoot one ray. Returns: distance, wall type, which side was hit, where on the wall\n    dx = cos(ray)\n    dy = sin(ray)\n    if abs(dx) < 0.00001:\n        dx = 0.00001\n    if abs(dy) < 0.00001:\n        dy = 0.00001\n    mx = int(px)\n    my = int(py)\n    ddx = abs(1 / dx)        # distance the ray travels to cross one grid line\n    ddy = abs(1 / dy)\n    if dx < 0:\n        sx = -1\n        side_x = (px - mx) * ddx\n    else:\n        sx = 1\n        side_x = (mx + 1 - px) * ddx\n    if dy < 0:\n        sy = -1\n        side_y = (py - my) * ddy\n    else:\n        sy = 1\n        side_y = (my + 1 - py) * ddy\n    hit = 0\n    side = 0\n    while hit == 0:\n        if side_x < side_y:\n            side_x += ddx\n            mx += sx\n            side = 0\n        else:\n            side_y += ddy\n            my += sy\n            side = 1\n        if grid[my][mx] != 0:\n            hit = 1\n    if side == 0:\n        dist = side_x - ddx\n        wx = py + dist * dy\n    else:\n        dist = side_y - ddy\n        wx = px + dist * dx\n    wx = wx - floor(wx)\n    return dist, grid[my][mx], side, wx\n\ndef draw_world():\n    # ceiling and floor: bands of colour that get darker towards the horizon\n    for k in range(9):\n        shade = 78 - k * 8\n        draw_rect(0, 10 + k * 20, 480, 21, f\"rgb({shade // 3},{shade // 2},{shade})\")\n        draw_rect(0, -10 - k * 20, 480, 21, f\"rgb({26 + k * 7},{22 + k * 6},{18 + k * 5})\")\n    # walls: one tall thin rectangle per slice\n    for i in range(COLS):\n        ray = angle - FOV / 2 + FOV * i / COLS\n        dist, kind, side, wx = cast(ray)\n        dist = dist * cos(ray - angle)       # fixes the \"fish eye\" bulge\n        if dist < 0.05:\n            dist = 0.05\n        h = 330 / dist                       # near = tall, far = short\n        if h > 360:\n            h = 360\n        idx = kind\n        if idx == 9:\n            idx = 4\n        shade = 1.15 - dist / 11             # fog\n        if shade < 0.12:\n            shade = 0.12\n        if kind == 9:\n            shade = 1.0                      # the door glows\n        if side == 1:\n            shade = shade * 0.78             # walls facing the other way are darker\n        if int(wx * 6) % 2 == 0:\n            shade = shade * 0.92             # faint vertical stripes look like bricks\n        c = WALLS[idx]\n        draw_rect(-240 + (i + 0.5) * SLICE, 0, SLICE + 1, h, f\"rgb({int(c[0] * shade)},{int(c[1] * shade)},{int(c[2] * shade)})\")\n\ndef draw_map():\n    size = 5\n
